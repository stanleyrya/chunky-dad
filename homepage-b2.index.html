/* --- prototype switcher (not part of any option) --- */
.opt-nav{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:10050;display:flex;gap:4px;background:rgba(20,18,40,.86);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:6px;font:700 15px/1 Poppins,system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.45);max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none}

/* --- shared: "next event" line on city cards (from js/city-activity.data.js) --- */
.city-next{display:block;font-size:.72rem;font-weight:500;white-space:nowrap}
.spacer-card{display:none!important}
.city-count{white-space:nowrap}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;max-width:1200px;margin:0 auto .9rem;padding:0 1.25rem}
.sec-head h2{margin:0;text-align:left;font-size:1.35rem;font-weight:700;line-height:1.15}
.sec-head .eyebrow{display:block;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin-bottom:.15rem}
.sec-head .aside{font-size:.8rem;font-weight:500;white-space:nowrap}
:root{--ink:#e8eaff;--muted:#9aa0c3;--acc:#9fb2ff;--card:#171a33;--edge:rgba(159,178,255,.16);--edge-hi:rgba(159,178,255,.38);--ground:#0b0d13}
/* The ground is the city pages' dusk, unchanged, so home and city share one
   background instead of inventing a second dark. */
/* body keeps the site's purple: it is what paints the strip behind the status
   bar / notch, and every section paints its own ground over it. */
body.index-page main{background:radial-gradient(circle at top,#1b2033 0%,#0b0d13 45%,#07090f 100%);background-attachment:fixed;color:var(--ink);padding:.25rem 0 2rem}
.sec-head h2{color:var(--ink)}.sec-head .eyebrow{color:var(--acc)}.sec-head .aside{color:var(--muted)}
.cities-compact,.bear-events-compact{background:none;color:inherit;padding:.5rem 0 1.5rem;overflow:visible}
.cities-compact .container,.bear-events-compact .container{padding:0 1.25rem}
.city-search-container{max-width:480px;margin:0 auto 1rem;padding:0 1.25rem}
.city-search-input{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--edge);box-shadow:none;backdrop-filter:none;padding:.7rem 1.2rem}
.city-search-input::placeholder{color:var(--muted)}.city-search-input:focus{background:rgba(255,255,255,.09);border-color:var(--edge-hi);box-shadow:none}
.near-me-btn{background:rgba(255,255,255,.06);border:1px solid var(--edge);box-shadow:none;backdrop-filter:none}
.near-me-btn.near-me-active{background:rgba(159,178,255,.22);border-color:var(--edge-hi)}
.city-compact-card .city-emoji{animation:none}.city-compact-card.coming-soon,.event-compact-card.coming-soon{opacity:1}
.city-compact-card.coming-soon .city-emoji,.event-compact-card.coming-soon .event-emoji{animation:none}
#homeMap{border-radius:14px!important;margin-top:.9rem!important;height:300px;min-height:0;max-height:none;aspect-ratio:auto;border:1px solid var(--edge);background:var(--card)}
@media(min-width:769px){#homeMap{height:420px}}
/* footer: the main page's, as-is */
footer{background:var(--black);color:var(--text-inverse);padding:2rem 0;text-align:center}
.city-scroll-container{padding:0 0 .5rem}
.city-compact-grid{gap:.55rem;padding:.25rem 1.25rem;min-width:max-content}
.city-compact-card{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:.65rem;align-items:center;min-width:0;width:158px;background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:.5rem .75rem .5rem .5rem;color:var(--ink);text-align:left;transition:transform .2s ease,border-color .2s ease}
.city-compact-card:hover{transform:translateY(-2px);border-color:var(--edge-hi)}
.city-compact-card .city-emoji-box{grid-row:1/3;width:40px;height:40px;padding:0;border-radius:10px;background:rgba(159,178,255,.12);border:none;backdrop-filter:none}
.city-compact-card:hover .city-emoji-box{background:rgba(159,178,255,.2);border-color:transparent}
.city-compact-card .city-emoji{font-size:1.45rem}
.city-compact-card .city-name{font-size:.88rem;letter-spacing:0;align-self:end;color:var(--ink)}
.city-next{color:var(--acc);align-self:start}
.city-compact-card.coming-soon{border-style:dashed}
@media(min-width:769px){.city-scroll-container{overflow:visible}.city-compact-grid{flex-wrap:wrap;min-width:0;max-width:1200px;margin:0 auto}.city-compact-card{width:auto;min-width:150px}}
.city-count{display:none}
/* OPTION B2 — B with the seam gone (sunset splash) and festivals as a
   poster rail with month markers instead of the vertical timeline. */
.event-scroll-container{padding:0 0 .75rem}
.event-compact-grid{gap:.6rem;padding:.25rem 1.25rem;min-width:max-content;align-items:stretch}
.month-label{flex:0 0 auto;writing-mode:vertical-rl;transform:rotate(180deg);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);font-weight:600;padding:.5rem 0;border-right:1px solid var(--edge);margin:0 .15rem 0 .35rem;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.month-label:first-of-type{margin-left:0}
.event-compact-card{flex-direction:column;align-items:flex-start;text-align:left;gap:.55rem;width:172px;min-width:172px;background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:.8rem;color:var(--ink);transition:transform .2s ease,border-color .2s ease}
.event-compact-card:hover{transform:translateY(-3px);border-color:var(--edge-hi)}
.event-compact-card .event-emoji-box{width:52px;height:52px;padding:0;border-radius:13px;background:rgba(159,178,255,.12);border:none;backdrop-filter:none}
.event-compact-card:hover .event-emoji-box{background:rgba(159,178,255,.2);border-color:transparent}
.event-compact-card .event-emoji{font-size:1.7rem}.event-compact-card .event-favicon{width:36px;height:36px;border-radius:8px}
.event-compact-card .event-content{align-items:flex-start;gap:.15rem;text-align:left}
.event-compact-card .bear-event-name{white-space:normal;color:var(--ink);font-size:.9rem;letter-spacing:0;line-height:1.2}
.event-compact-card .event-dates{color:var(--acc);font-weight:600;font-size:.78rem;opacity:1}
.event-compact-card .event-location{color:var(--muted);font-size:.74rem;opacity:1}
.event-compact-card.coming-soon{border-style:dashed}
.city-next,.city-count{display:none!important}
/* ---- fixes ---- */
/* 5. the splash keeps its purple all the way down and meets the page on a
   hairline, the way the city pages meet their header. The page's own ground
   starts as deep indigo, never black, so nothing fades out underneath. */
.hero{background:var(--solid-primary)!important;position:relative;z-index:2;border-bottom:1px solid rgba(255,255,255,.2);box-shadow:0 14px 30px rgba(0,0,0,.35)}
body.index-page main{padding-top:1.1rem}
/* 1. the city name sits in the middle of its tile, beside the emoji */
.city-compact-card{grid-template-rows:auto!important;align-items:center;padding:.55rem .8rem .55rem .5rem}
.city-compact-card .city-emoji-box{grid-row:auto!important}
.city-compact-card .city-name{align-self:center!important;font-size:.92rem;font-weight:600}
/* 4. shorter festival cards */
.event-compact-grid{align-items:stretch}
.event-compact-card{width:158px;min-width:158px;gap:.45rem;padding:.65rem .7rem}
.event-compact-card .event-emoji-box{width:42px;height:42px;border-radius:11px}
.event-compact-card .event-emoji{font-size:1.35rem}
.event-compact-card .event-favicon{width:28px;height:28px;border-radius:7px}
.event-compact-card .bear-event-name{font-size:.84rem;line-height:1.18}
.event-compact-card .event-dates{font-size:.74rem}
.event-compact-card .event-location{font-size:.7rem}
.month-label{font-size:.62rem;padding:.35rem 0}
/* even, shorter festival cards: the title gets two lines, the place one */
.event-compact-card .bear-event-name{display:-webkit-box!important;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.event-compact-card .event-location{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.event-compact-card .event-content{width:100%;min-width:0}
/* ---- round 2 of fixes ---- */
/* 2. search + near-me ride on the same line as the section title */
.sec-head{align-items:center;gap:.75rem;flex-wrap:wrap}
.sec-head .city-search-container{margin:0 0 0 auto;padding:0;max-width:300px;flex:1 1 190px;min-width:0}
.sec-head .city-search-input{padding:.5rem .95rem;font-size:.9rem}
.sec-head .near-me-btn{width:38px;height:38px;font-size:1rem}
.bear-events-compact .sec-head{margin-bottom:.7rem}
/* 3. the festival rail gets short, wide cards instead of tall posters */
.event-compact-card{flex-direction:row!important;align-items:center;width:232px;min-width:232px;gap:.6rem;padding:.5rem .7rem .5rem .5rem;border-radius:13px}
.event-compact-card .event-emoji-box{width:38px;height:38px;border-radius:10px;flex:0 0 auto}
.event-compact-card .event-emoji{font-size:1.2rem}
.event-compact-card .event-favicon{width:26px;height:26px;border-radius:6px}
.event-compact-card .event-content{gap:0;min-width:0}
.event-compact-card .bear-event-name{-webkit-line-clamp:1;font-size:.83rem;line-height:1.25}
.event-compact-card .event-dates{font-size:.72rem}
.event-compact-card .event-location{font-size:.68rem}
.month-label{font-size:.6rem;letter-spacing:.14em;padding:.25rem 0}
/* 4. a pin taps to its city tile, which lights up rather than jumping away */
.city-compact-card.pin-picked{border-color:var(--edge-hi);background:var(--card);box-shadow:0 0 0 2px rgba(159,178,255,.28)}
/* 1. the map's attribution starts collapsed */
.maplibregl-ctrl-attrib.maplibregl-compact-show .maplibregl-ctrl-attrib-inner{display:none}
.maplibregl-ctrl-attrib.maplibregl-compact-show{padding:2px 24px 2px 0!important}
/* ---- one type scale for everything between hero and footer ----
   Three steps only: section title, item, detail. Every section used its own
   near-identical size before (14.7 / 13.3 / 11.5 / 11.2 / 10.9 / 9.6px). */
main{--t-title:1.25rem;--t-item:0.875rem;--t-detail:0.75rem}
main .sec-head h2{font-size:var(--t-title)!important;line-height:1.2}
main .city-search-input{font-size:var(--t-item)!important}
main .city-compact-card .city-name{font-size:var(--t-item)!important}
main .event-compact-card .bear-event-name{font-size:var(--t-item)!important}
main .event-compact-card .event-dates{font-size:var(--t-detail)!important}
main .event-compact-card .event-location{font-size:var(--t-detail)!important}
main .month-label{font-size:var(--t-detail)!important}
main .city-search-input::placeholder{font-size:var(--t-item)}
/* the header slides in solid: it used to fade up from transparent while it
   moved, so you saw the page through it for the length of the slide */
body.index-page header{opacity:1!important;background:var(--solid-primary)!important;transition:transform .3s cubic-bezier(.4,0,.2,1)!important}
body.index-page header.visible{opacity:1!important}
/* city tiles size to their own name: 158px fixed made "San Francisco" spill
   out and left "DC" mostly empty */
.city-compact-card{width:auto!important;min-width:0!important}
.city-compact-card .city-name{white-space:nowrap;overflow:visible}
/* festival icons use the city pages' favicon plate: the artwork sits on its
   own plate, contain-fit with the 2px outset ring, instead of floating in a
   tinted box at whatever size it happened to be */
.event-compact-card .event-emoji-box.has-favicon{background:var(--fav-plate,var(--favicon-plate-bg));border-radius:var(--favicon-plate-radius);overflow:hidden;padding:0;border:0 solid transparent;box-shadow:0 0 0 1px rgba(23,26,51,.25),0 2px 6px rgba(6,8,20,.3)}
.event-compact-card:hover .event-emoji-box.has-favicon{background:var(--fav-plate,var(--favicon-plate-bg))}
.event-compact-card .event-favicon{width:100%;height:100%;object-fit:contain;padding:var(--favicon-plate-pad);border-radius:calc(var(--favicon-plate-radius) - 2px);display:block}
/* smaller bear-run cards: name on one line, date and place sharing the next */
.event-compact-card{width:196px!important;min-width:196px!important;padding:.42rem .6rem .42rem .42rem;gap:.5rem}
.event-compact-card .event-emoji-box{width:32px!important;height:32px!important;border-radius:8px}
.event-compact-card .event-emoji{font-size:1.05rem}
.event-compact-card .event-content{display:grid!important;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:.35rem;align-items:baseline}
.event-compact-card .bear-event-name{grid-column:1/-1;grid-row:1}
.event-compact-card .event-dates{grid-column:1;grid-row:2}
.event-compact-card .event-location{grid-column:2;grid-row:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.event-compact-card .event-location:not(:empty)::before{content:'·';margin-right:.3rem;color:var(--muted)}
.event-compact-card .event-favicon{border-radius:calc(8px - 2px)}
.event-compact-card .event-emoji-box.has-favicon{border-radius:8px}
/* the date keeps to one line so a long "Martin Luther King Jr. weekend"
   cannot stretch the whole rail */
.event-compact-card .event-content{grid-template-columns:minmax(0,auto) minmax(0,1fr)}
.event-compact-card .event-dates{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* bear-run cards back up to a comfortable size (66px was too mean) */
.event-compact-card{width:224px!important;min-width:224px!important;padding:.6rem .75rem .6rem .55rem;gap:.6rem}
.event-compact-card .event-emoji-box{width:44px!important;height:44px!important;border-radius:11px}
.event-compact-card .event-emoji{font-size:1.4rem}
.event-compact-card .event-emoji-box.has-favicon{border-radius:11px}
.event-compact-card .event-favicon{border-radius:calc(11px - 2px)}
.event-compact-card .event-content{row-gap:.12rem}
.event-compact-card .bear-event-name{line-height:1.3}
.month-label{font-size:.68rem}
.event-compact-card{min-height:84px}
/* the hint is position:fixed and only fades to opacity 0 when you scroll, so
   it kept catching taps at the bottom of the screen — a stray tap there fired
   a second jump */
.hero-scroll-hint{transition:opacity .2s ease}
.hero-scroll-hint[data-hidden="1"]{pointer-events:none}
/* bigger again: wider so names stop truncating to "Southern…", a 48px icon,
   and room for a two-line name */
.event-compact-card{width:252px!important;min-width:252px!important;min-height:96px;padding:.7rem .8rem .7rem .65rem;gap:.7rem}
.event-compact-card .event-emoji-box{width:48px!important;height:48px!important;border-radius:12px}
.event-compact-card .event-emoji-box.has-favicon{border-radius:12px}
.event-compact-card .event-favicon{border-radius:calc(12px - 2px)}
.event-compact-card .event-emoji{font-size:1.5rem}
.event-compact-card .bear-event-name{-webkit-line-clamp:2!important;white-space:normal}
/* three rows again: title, date, location */
.event-compact-card .event-content{display:flex!important;flex-direction:column;align-items:flex-start;row-gap:.1rem;min-width:0;width:100%}
.event-compact-card .bear-event-name,.event-compact-card .event-dates,.event-compact-card .event-location{grid-column:auto;grid-row:auto;max-width:100%}
.event-compact-card .event-location::before{content:none!important}
.event-compact-card .event-location{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* the parenthetical line */
.event-compact-card .event-paren{font-size:var(--t-detail);color:var(--muted);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:1.25}
/* exactly three lines: title, date, location */
.event-compact-card{min-height:102px}
.event-compact-card .bear-event-name{-webkit-line-clamp:1!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block!important}
.event-compact-card .event-paren{display:none}

/* cards size to their own text, the way the city tiles do */
.event-compact-card{width:auto!important;min-width:0!important;max-width:none}
.event-compact-card .event-content{width:auto;min-width:0}
.event-compact-card .bear-event-name,.event-compact-card .event-dates,.event-compact-card .event-location{max-width:none;overflow:visible;text-overflow:clip}
/* Explore turns up sooner: it was waiting 1.5s then fading for 1s, so it only
   settled at 2.5s — after the logo, the title and the joke bubble */
.hero-scroll-hint{animation:heroScrollHintFade .45s ease-out .55s both!important}
    </style>

<script>
// Prototype-only helpers: "next event" under each city (from window.CITY_ACTIVITY),
// date parsing off the rendered festival cards, and a ready hook for each card type.
(function(){
  function pad(n){return String(n).padStart(2,'0');}
  function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  var TODAY=iso(new Date());
  function daysFromToday(isoDate){return Math.round((new Date(isoDate+'T12:00:00')-new Date(TODAY+'T12:00:00'))/864e5);}
  function cityInfo(entry){
    if(!entry) return {label:'',next:null,count:0,bucket:'later'};
    var next=(entry.dates||[]).filter(function(d){return d>=TODAY;}).sort()[0]||null;
    var count=(entry.dates||[]).filter(function(d){return d>=TODAY;}).length+(entry.recurring||0);
    var fest=entry.festivalUntil&&entry.festivalUntil>=TODAY;
    var label='',bucket='later';
    if(next){var diff=daysFromToday(next), d=new Date(next+'T12:00:00');
      if(diff===0){label='Today';bucket='tonight';}
      else if(diff===1){label='Tomorrow';bucket='tomorrow';}
      else if(diff<7){label=d.toLocaleDateString(undefined,{weekday:'long'});bucket='week';}
      else if(entry.recurring>0){label='Regular nights';bucket='regular';}
      else{label=d.toLocaleDateString(undefined,{month:'short',day:'numeric'});bucket='later';}
    } else if(entry.recurring>0){label='Regular nights';bucket='regular';}
    else if(fest){label='Festival';bucket='later';}
    return {label:label,next:next,count:count,bucket:bucket};
  }
  function decorate(){
    var act=(window.CITY_ACTIVITY&&window.CITY_ACTIVITY.cities)||{};
    document.querySelectorAll('.city-compact-card[data-city-key]').forEach(function(card){
      if(card.querySelector('.city-next')) return;
      var info=cityInfo(act[card.dataset.cityKey]);
      card.dataset.bucket=info.bucket; card.dataset.next=info.next||'';
      var s=document.createElement('span'); s.className='city-next'; s.textContent=info.label; card.appendChild(s);
      var c=document.createElement('span'); c.className='city-count'; c.textContent=info.count?(info.count+(info.count===1?' night':' nights')+' listed'):''; card.appendChild(c);
    });
  }
  // "9/17-9/20" -> {start,end} ISO; the year is inferred (upcoming, or ended within the last week)
  function parseCardDates(card){
    var t=(card.querySelector('.event-dates')||{}).textContent||'';
    var m=/^\s*(\d{1,2})\/(\d{1,2})(?:\s*[-–]\s*(\d{1,2})\/(\d{1,2}))?\s*$/.exec(t);
    if(!m) return null;
    var y=new Date().getFullYear();
    var start=y+'-'+pad(+m[1])+'-'+pad(+m[2]), end=m[3]?(y+'-'+pad(+m[3])+'-'+pad(+m[4])):start;
    if(daysFromToday(end)< -7){ y++; start=y+'-'+pad(+m[1])+'-'+pad(+m[2]); end=m[3]?(y+'-'+pad(+m[3])+'-'+pad(+m[4])):start; }
    return {start:start,end:end};
  }
  function onCards(type,fn){
    var sel=type==='city'?'.city-compact-card[data-city-key]':'.event-compact-card:not(.spacer-card)';
    if(document.querySelector(sel)) fn(); else document.addEventListener(type+'CardsReady',fn,{once:true});
  }
  window.PROTO={TODAY:TODAY,iso:iso,daysFromToday:daysFromToday,cityInfo:cityInfo,parseCardDates:parseCardDates,onCards:onCards,decorate:decorate};

})();
</script>
<script>
// B2: month markers along the festival rail
PROTO.onCards('event',function(){
  var grid=document.getElementById('event-grid'); if(!grid) return;
  var last=null, undatedMarked=false;
  Array.from(grid.querySelectorAll('.event-compact-card')).forEach(function(card){
    if(card.classList.contains('spacer-card')) return;
    if(card.classList.contains('coming-soon')) return;
    var d=PROTO.parseCardDates(card); var key, text;
    if(d){ var dt=new Date(d.start+'T12:00:00'); key=d.start.slice(0,7); text=dt.toLocaleDateString(undefined,{month:'short'}); if(dt.getFullYear()!==new Date().getFullYear()) text+=' ’'+String(dt.getFullYear()).slice(2); }
    else { if(undatedMarked) return; key='later'; text='TBA'; undatedMarked=true; }
    if(key===last) return; last=key;
    var l=document.createElement('div'); l.className='month-label'; l.textContent=text; grid.insertBefore(l,card);
  });
});
</script>
<script>
// 1+4. No attribution popup on load; a pin picks its city tile instead of
// navigating away (tap the lit-up tile to actually go).
(function(){
  function collapseAttrib(){
    document.querySelectorAll('.maplibregl-ctrl-attrib').forEach(function(a){
      a.classList.add('maplibregl-compact'); a.classList.remove('maplibregl-compact-show');
      a.removeAttribute('open');
      var b=a.querySelector('.maplibregl-ctrl-attrib-button'); if(b) b.setAttribute('aria-expanded','false');
    });
  }
  function pick(key){
    var card=document.querySelector('.city-compact-card[data-city-key="'+key+'"]'); if(!card) return;
    document.querySelectorAll('.city-compact-card.pin-picked').forEach(function(c){c.classList.remove('pin-picked');});
    card.classList.add('pin-picked');
    if(card.scrollIntoView) card.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  }
  function wire(){
    var hm=window.homeMap; if(!hm||!hm.markers||!hm.markers.length) return false;
    var byName={}, cfg=window.CITY_CONFIG||{};
    Object.keys(cfg).forEach(function(k){ if(cfg[k]&&cfg[k].name) byName[cfg[k].name.toLowerCase()]=k; });
    hm.markers.forEach(function(m){
      try{ var p=m.getPopup&&m.getPopup(); if(p){ if(p.isOpen&&p.isOpen()) p.remove(); m.setPopup(null); } }catch(e){}
      var el=m.getElement&&m.getElement(), key=byName[m.cityName];
      if(el&&key&&!el.dataset.linked){ el.dataset.linked='1'; el.style.cursor='pointer';
        el.addEventListener('click',function(ev){ ev.stopPropagation(); ev.preventDefault(); pick(key); },true); }
    });
    collapseAttrib();
    return true;
  }
  var tries=0, t=setInterval(function(){ collapseAttrib(); if(wire()||++tries>40) clearInterval(t); },250);
  document.addEventListener('click',function(e){ if(!e.target.closest('.city-compact-card')&&!e.target.closest('#homeMap'))
    document.querySelectorAll('.city-compact-card.pin-picked').forEach(function(c){c.classList.remove('pin-picked');}); });
})();
// 6. The Explore hint scrolls to the cities. It re-aligns after the jump
// because iOS collapses its toolbar mid-scroll, which grows 100dvh and moves
// the target out from under us — that was the gap below the header.
(function(){
  var hint=document.querySelector('.hero-scroll-hint'); if(!hint) return;
  hint.style.cursor='pointer'; hint.setAttribute('role','button'); hint.setAttribute('tabindex','0');
  var CUSHION=12;
  function headerH(){ var h=document.querySelector('header');
    if(!h) return 0; var cs=getComputedStyle(h);
    return cs.position==='fixed' ? h.offsetHeight : 0; }
  function align(smooth){
    var t=document.getElementById('cities'); if(!t) return;
    var y=Math.max(0, t.getBoundingClientRect().top+(window.pageYOffset||document.documentElement.scrollTop||0)-headerH()-CUSHION);
    if(smooth&&'scrollBehavior' in document.documentElement.style) window.scrollTo({top:y,behavior:'smooth'});
    else window.scrollTo(0,y);
  }
  // Correct only once the scroll has actually stopped. Firing mid-animation
  // added to the in-flight smooth scroll instead of replacing it, which is
  // what carried the page past the section.
  function go(){
    align(true);
    var t0=Date.now(), last=-1, still=0;
    var iv=setInterval(function(){
      var y=Math.round(window.pageYOffset||document.documentElement.scrollTop||0);
      if(y===last){ still++; } else { still=0; last=y; }
      if(still>=3 || Date.now()-t0>2500){
        clearInterval(iv);
        var t=document.getElementById('cities'); if(!t) return;
        var off=t.getBoundingClientRect().top-headerH()-CUSHION;
        if(Math.abs(off)>2) window.scrollTo(0, y+off);
      }
    },80);
  }
  // once it has faded out it must not take taps any more
  function guard(){ hint.dataset.hidden = (window.pageYOffset>50) ? '1' : '0'; }
  window.addEventListener('scroll',guard,{passive:true}); guard();
  // read the scroll position directly rather than trusting the scroll event
  hint.addEventListener('click',function(e){ if((window.pageYOffset||document.documentElement.scrollTop||0)>50) return; go(); });
  hint.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } });
})();
</script>
<script>
// Each festival icon sits on ITS OWN plate colour, the way the city pages
// tint theirs from the extracted faviconPlate — white was only the fallback.
PROTO.onCards('event',function(){
  var plates=window.PROTO_PLATES||{};
  document.querySelectorAll('.event-emoji-box.has-favicon').forEach(function(box){
    var img=box.querySelector('.event-favicon'); if(!img) return;
    var m=/favicon-(.+?)-\d+px\./.exec(img.getAttribute('src')||''); if(!m) return;
    var plate=plates[m[1]];
    if(plate) box.style.setProperty('--fav-plate',plate);
  });
});
</script>

<script>
// Parentheticals are dropped entirely: "New Orleans, LA (French Quarter)"
// becomes "New Orleans, LA", so a card is always three lines.
PROTO.onCards('event',function(){
  document.querySelectorAll('.event-compact-card:not(.spacer-card)').forEach(function(card){
    ['.bear-event-name','.event-dates','.event-location'].forEach(function(sel){
      var el=card.querySelector(sel); if(!el||el.dataset.stripped) return;
      var t=el.textContent.replace(/\s*\([^()]*\)\s*/g,' ').replace(/\s{2,}/g,' ').trim();
      t=t.replace(/[\s,\/·-]+$/,'');
      el.dataset.stripped='1';
      if(t && t!==el.textContent.trim()) el.textContent=t;
    });
  });
});
</script>
