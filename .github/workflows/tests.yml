name: Scraper Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # The scraper tests are dependency-free (node:test + node:assert only),
      # so no npm install is needed.
      - run: npm test
