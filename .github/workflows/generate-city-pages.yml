name: Generate City Pages and Sitemap

on:
  push:
    branches: [ main ]
    paths:
      - 'city.html'
      - 'js/city-config.js'
      - 'tools/generate-city-pages.js'
      - 'tools/generate-sitemap.js'
      - 'tools/generate-scraper-cities.js'
      - '.github/workflows/generate-city-pages.yml'
      - 'data/calendars/**'
      - '!testing/**'
      - '!scripts/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Every workflow that commits to main shares this group: GitHub queues
# them one at a time, so two cannot race to push (the owner was being
# notified of failed pushes when two landed at once).
concurrency:
  group: main-commits
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Generate scraper cities
        run: node tools/generate-scraper-cities.js
      - name: Generate city pages
        run: node tools/generate-city-pages.js
      - name: Generate sitemap
        run: node tools/generate-sitemap.js
      - name: Commit changes if any
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: regenerate city pages and sitemap"
            # Other workflows commit to main too (the calendar refresh landed
            # 18 s before this job's push on 2026-09-17 and the push was
            # rejected, leaving 26 freshly built city pages unpublished).
            # Rebase onto whatever landed meanwhile and retry.
            # --autostash: a step can leave files it did not stage (a deleted
            # event page), and a plain pull --rebase refuses to run then — every
            # save after 2026-10-04 was lost that way while the job stayed green.
            pushed=false
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push && { pushed=true; break; }
              echo "push attempt $attempt failed — retrying"
              sleep 10
            done
            if [ "$pushed" != true ]; then echo "::error::could not push to main after 3 attempts"; exit 1; fi
          else
            echo "No changes to commit."
          fi

